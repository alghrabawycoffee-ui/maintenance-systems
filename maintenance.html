<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | مسئول الصيانة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --glpi-navbar: #2C3E50; --glpi-sidebar: #222D32; --glpi-bg: #F4F6F9; --glpi-accent: #3498DB; --glpi-border: #D2D6DE; --glpi-danger: #DD4B39; --glpi-success: #00A65A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background: var(--glpi-bg); color: #333; font-size: 14px; overflow: hidden; }
        .sidebar { width: 250px; background: var(--glpi-sidebar); color: #B8C7CE; display: flex; flex-direction: column; }
        .sidebar-header { height: 60px; background: #1A2226; display: flex; align-items: center; padding: 0 20px; font-size: 18px; font-weight: 700; color: white; border-bottom: 1px solid #111; }
        .sidebar-header i { color: var(--glpi-accent); margin-left: 10px; }
        .nav-menu { padding: 10px 0; flex-grow: 1; }
        .nav-btn { display: flex; align-items: center; padding: 14px 20px; background: none; border: none; color: #B8C7CE; text-align: right; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; transition: 0.2s; border-right: 4px solid transparent; }
        .nav-btn i { width: 30px; text-align: center; margin-left: 10px; }
        .nav-btn:hover, .nav-btn.active { background: #1A2226; color: white; border-right-color: var(--glpi-accent); }
        .sidebar-footer { padding: 15px; border-top: 1px solid #111; }
        .logout-btn { width: 100%; padding: 12px; background: var(--glpi-danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { height: 60px; background: var(--glpi-navbar); color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
        .user-profile { font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .content-body { flex: 1; padding: 25px; overflow-y: auto; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--glpi-navbar); margin-bottom: 25px; border-bottom: 2px solid var(--glpi-border); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .table-container { background: white; border: 1px solid var(--glpi-border); border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        .table-header { padding: 15px 20px; background: #F9F9F9; border-bottom: 1px solid var(--glpi-border); font-weight: 700; color: var(--glpi-navbar); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; padding: 12px 20px; font-size: 13px; color: var(--glpi-navbar); border-bottom: 2px solid var(--glpi-border); background: #F4F6F9; }
        td { padding: 12px 20px; border-bottom: 1px solid var(--glpi-border); color: #555; }
        tbody tr:nth-child(even) { background: #FAFAFA; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; font-family: 'Cairo'; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--glpi-navbar); color: white; }
        .btn-success { background: var(--glpi-success); color: white; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; color: var(--glpi-navbar); }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--glpi-border); border-radius: 4px; font-family: 'Cairo'; font-size: 14px; outline: none; background: #FAFAFA; }
        .tab { display: none; } .tab.active { display: block; }
        .badge { padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; color: white; }
        .bg-green { background: var(--glpi-success); }
        .bg-red { background: var(--glpi-danger); }
        .bg-orange { background: #F39C12; }
        .bg-blue { background: #3498DB; }
        .bg-purple { background: #9b59b6; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--glpi-border); display: flex; align-items: center; justify-content: space-between; }
        .stat-card h3 { font-size: 14px; color: #7F8C8D; margin-bottom: 5px; }
        .stat-card .num { font-size: 28px; font-weight: 700; }
        .stat-card i { font-size: 40px; color: #ECF0F1; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 500px; border-radius: 8px; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glpi-border); padding-bottom: 15px; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #777; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><i class="fas fa-tools"></i> Maintenance</div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="showTab('tickets', this)"><i class="fas fa-ticket-alt"></i> التذاكر</button>
            <button class="nav-btn" onclick="showTab('assets', this)"><i class="fas fa-desktop"></i> الأصول</button>
            <button class="nav-btn" onclick="showTab('custody', this)"><i class="fas fa-box-open"></i> إرسال عهدة</button>
        </div>
        <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button></div>
    </div>

    <div class="main-content">
        <div class="top-header">
            <div class="user-profile"><span id="header-username">مسئول الصيانة</span><i class="fas fa-user-circle" style="font-size:24px;"></i></div>
        </div>

        <div class="content-body">
            <div id="tab-tickets" class="tab active">
                <div class="page-title"><span><i class="fas fa-ticket-alt"></i> لوحة التحكم</span></div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div><h3>تذاكر مفتوحة</h3><div class="num" style="color:var(--glpi-danger);" id="st-open">0</div></div>
                        <i class="fas fa-envelope-open"></i>
                    </div>
                    <div class="stat-card">
                        <div><h3>بانتظار تأكيد الفروع</h3><div class="num" style="color:#9b59b6;" id="st-pending">0</div></div>
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                    <div class="stat-card">
                        <div><h3>تذاكر مغلقة</h3><div class="num" style="color:var(--glpi-success);" id="st-closed">0</div></div>
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
                <div class="table-container">
                    <table id="tbl-tickets"><thead><tr><th>#</th><th>الفرع</th><th>التصنيف</th><th>الأصل</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody></tbody></table>
                </div>
            </div>

            <div id="tab-assets" class="tab">
                <div class="page-title"><span><i class="fas fa-desktop"></i> كل الأصول</span></div>
                <div class="table-container">
                    <div class="table-header"><span>إضافة أصل جديد</span></div>
                    <div style="padding:20px;">
                        <div class="form-grid">
                            <div class="form-group"><label class="form-label">اسم الأصل</label><input type="text" id="a-name" class="form-control" placeholder="مثال: تكييف شارب"></div>
                            <div class="form-group"><label class="form-label">كود الأصل</label><input type="text" id="a-code" class="form-control" placeholder="مثال: AC-001"></div>
                            <div class="form-group"><label class="form-label">الفرع</label><select id="a-branch" class="form-control"></select></div>
                            <div class="form-group"><label class="form-label">التصنيف</label><input type="text" id="a-cat" class="form-control" placeholder="مثال: تكييفات"></div>
                        </div>
                        <button class="btn btn-primary" onclick="addAsset()">إضافة الأصل</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="tbl-assets"><thead><tr><th>الكود</th><th>الاسم</th><th>الفرع</th><th>الحالة</th></tr></thead><tbody></tbody></table>
                </div>
            </div>

            <div id="tab-custody" class="tab">
                <div class="page-title"><span><i class="fas fa-box-open"></i> إرسال عهدة جديدة للفرع</span></div>
                <div class="table-container">
                    <div class="table-header"><span>بيانات العهدة</span></div>
                    <div style="padding:20px;">
                        <div class="form-grid">
                            <div class="form-group"><label class="form-label">اسم الأصل</label><input type="text" id="c-name" class="form-control" placeholder="مثال: طابعة ليزر"></div>
                            <div class="form-group"><label class="form-label">كود الأصل</label><input type="text" id="c-code" class="form-control" placeholder="مثال: PR-002"></div>
                            <div class="form-group"><label class="form-label">الفرع</label><select id="c-branch" class="form-control"></select></div>
                            <div class="form-group"><label class="form-label">التصنيف</label><input type="text" id="c-cat" class="form-control" placeholder="مثال: طابعات"></div>
                        </div>
                        <button class="btn btn-primary" onclick="sendCustody()">إرسال العهدة</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="tbl-custody"><thead><tr><th>الأصل</th><th>الكود</th><th>الفرع</th><th>الحالة</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div id="close-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إنهاء التذكرة وإرسالها للفرع</h3>
                <button class="modal-close" onclick="document.getElementById('close-modal').style.display='none'">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">تفاصيل الإصلاح (ما تم فعله لحل المشكلة):</label>
                <textarea id="resolution-input" class="form-control" rows="4" placeholder="مثال: تم تغيير الكومبريسور وتعبئة الفريون..."></textarea>
            </div>
            <button class="btn btn-success" onclick="confirmClose()" style="width:100%;">إرسال للفرع لتأكيد الإصلاح</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')
        
        let userProfile = null;
        let currentTicketId = null;
        let currentAssetId = null;

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) { window.location.replace('index.html'); return; }
            
            const { data } = await supabase.from('profiles').select('*, branches(name)').eq('id', user.id).single();
            userProfile = data;
            if(userProfile?.role !== 'maintenance') { window.location.replace('index.html'); return; }
            
            document.getElementById('header-username').innerText = userProfile.full_name;
            
            const { data: branches } = await supabase.from('branches').select('*');
            const optHtml = branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            document.getElementById('a-branch').innerHTML = optHtml;
            document.getElementById('c-branch').innerHTML = optHtml;

            loadData();
        }
        init();

        window.logout = async () => { await supabase.auth.signOut(); window.location.replace('index.html'); }
        window.showTab = (id, btn) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        async function loadData() {
            const { data: tickets } = await supabase.from('tickets').select('*, assets(name), branches(name)').order('id', {ascending:false});
            const tbodyT = document.querySelector('#tbl-tickets tbody'); tbodyT.innerHTML = '';
            
            let openC = 0, closedC = 0, pendingC = 0;

            tickets?.forEach(t => {
                if(t.status === 'closed') closedC++; 
                else if(t.status === 'pending_approval') pendingC++;
                else openC++;

                let statusHtml = t.status === 'open' ? '<span class="badge bg-orange">مفتوح</span>' : 
                                 t.status === 'pending_approval' ? '<span class="badge bg-purple">بانتظار تأكيد الفرع</span>' :
                                 t.status === 'closed' ? '<span class="badge bg-green">مغلق</span>' : 
                                 '<span class="badge bg-blue">قيد المعالجة</span>';
                
                let action = `<button class="btn btn-primary" onclick="window.open('ticket-view.html?id=${t.id}', '_blank')">عرض</button> `;
                if(t.status === 'open' || t.status === 'in_progress') {
                    action += `<button class="btn btn-success" style="margin-right:5px;" onclick="openCloseModal(${t.id}, ${t.asset_id})">إنهاء وإرسال</button>`;
                }

                tbodyT.innerHTML += `<tr><td>#${t.id}</td><td>${t.branches?.name}</td><td>${t.category || '-'}</td><td>${t.assets?.name}</td><td>${statusHtml}</td><td>${action}</td></tr>`;
            });

            document.getElementById('st-open').innerText = openC;
            document.getElementById('st-closed').innerText = closedC;
            document.getElementById('st-pending').innerText = pendingC;

            const { data: assets } = await supabase.from('assets').select('*, branches(name)');
            const tbodyA = document.querySelector('#tbl-assets tbody'); tbodyA.innerHTML = '';
            assets?.forEach(a => {
                tbodyA.innerHTML += `<tr><td>${a.code}</td><td>${a.name}</td><td>${a.branches?.name}</td><td>${a.status === 'working' ? '<span class="badge bg-green">سليم</span>' : '<span class="badge bg-red">عطلان</span>'}</td></tr>`;
            });

            const { data: custody } = await supabase.from('custody_transfers').select('*, branches(name)').order('id', {ascending:false});
            const tbodyC = document.querySelector('#tbl-custody tbody'); tbodyC.innerHTML = '';
            custody?.forEach(c => {
                let statusHtml = c.status === 'pending' ? '<span class="badge bg-orange">في انتظار موافقة الفرع</span>' :
                                 c.status === 'approved' ? '<span class="badge bg-green">تمت الموافقة</span>' : 
                                 '<span class="badge bg-red">مرفوض</span>';
                tbodyC.innerHTML += `<tr><td>${c.asset_name}</td><td>${c.asset_code}</td><td>${c.branches?.name}</td><td>${statusHtml}</td></tr>`;
            });
        }

        window.openCloseModal = (ticketId, assetId) => {
            currentTicketId = ticketId;
            currentAssetId = assetId;
            document.getElementById('resolution-input').value = '';
            document.getElementById('close-modal').style.display = 'flex';
        }

        window.confirmClose = async () => {
            const notes = document.getElementById('resolution-input').value.trim();
            if(!notes) return alert('يجب كتابة تفاصيل الإصلاح قبل الإرسال');

            await supabase.from('tickets').update({ 
                status: 'pending_approval', 
                resolution_notes: notes,
                closed_by: userProfile.id, 
                closed_at: new Date().toISOString() 
            }).eq('id', currentTicketId);
            
            document.getElementById('close-modal').style.display = 'none';
            loadData();
            alert('تم إرسال الإصلاح للفرع لتأكيده.');
        }

        window.addAsset = async () => {
            const name = document.getElementById('a-name').value;
            const code = document.getElementById('a-code').value;
            const branch_id = document.getElementById('a-branch').value;
            const category = document.getElementById('a-cat').value;
            if(!name || !code) return alert('اكتب الاسم والكود');
            await supabase.from('assets').insert([{ name, code, branch_id, category, status: 'working' }]);
            document.getElementById('a-name').value = ''; document.getElementById('a-code').value = ''; document.getElementById('a-cat').value = '';
            loadData(); alert('تم إضافة الأصل');
        };

        window.sendCustody = async () => {
            const name = document.getElementById('c-name').value;
            const code = document.getElementById('c-code').value;
            const branch_id = document.getElementById('c-branch').value;
            const category = document.getElementById('c-cat').value;
            if(!name || !code) return alert('اكتب الاسم والكود');
            await supabase.from('custody_transfers').insert([{ asset_name: name, asset_code: code, branch_id, category, created_by: userProfile.id }]);
            document.getElementById('c-name').value = ''; document.getElementById('c-code').value = ''; document.getElementById('c-cat').value = '';
            loadData(); alert('تم إرسال العهدة للفرع');
        };
    </script>
</body>
</html>

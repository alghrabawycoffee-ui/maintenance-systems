<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance System | تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Cairo',sans-serif; background:#2C3E50; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .login-box { background:#fff; padding:40px; border-radius:8px; width:350px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,.2); }
    h2 { color:#2C3E50; margin-bottom:20px; }
    input { width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-family:'Cairo'; }
    button { width:100%; padding:10px; background:#3498DB; color:#fff; border:none; border-radius:4px; font-weight:bold; font-family:'Cairo'; cursor:pointer; }
    button:hover { background:#2980B9; }
    button:disabled { background:#95A5A6; cursor:not-allowed; }
    #error { color:red; font-size:14px; margin-top:10px; display:none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Maintenance System</h2>
    <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
    <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button type="button" id="login-btn">دخول</button>
    <div id="error"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    
    const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')

    document.getElementById('login-btn').addEventListener('click', async () => {
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      err.style.display = 'none';
      if (!username || !password) {
        err.innerText = 'الرجاء إدخال البيانات'; err.style.display = 'block'; return;
      }

      btn.innerText = 'جاري التحقق...'; btn.disabled = true;

      const email = `${username.toLowerCase().trim()}@system.local`;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        err.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة';
        err.style.display = 'block';
        btn.innerText = 'دخول'; btn.disabled = false;
        return;
      }

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
      const role = profile?.role;
      
      if (role === 'admin') window.location.href = 'admin.html';
      else if (role === 'maintenance') window.location.href = 'maintenance.html';
      else window.location.href = 'branch.html';
    });
  </script>
</body>
</html>

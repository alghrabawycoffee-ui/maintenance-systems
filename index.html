<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2C3E50; --secondary: #34495E; --bg: #F4F6F9; --danger: #DD4B39; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg); }
        
        /* الجزء الشمال (اللوجو والبراند) */
        .brand-section { flex: 1; background-color: var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; position: relative; overflow: hidden; }
        .brand-section::before { content: ''; position: absolute; top: -50px; left: -50px; width: 300px; height: 300px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .brand-section h1 { font-size: 42px; font-weight: 800; margin-bottom: 10px; z-index: 1; }
        .brand-section p { font-size: 18px; color: #B8C7CE; z-index: 1; }

        /* الجزء اليمين (فورم الدخول) */
        .login-section { flex: 1; display: flex; justify-content: center; align-items: center; background-color: white; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; }
        .login-box h2 { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .login-box p { color: #777; margin-bottom: 30px; font-size: 15px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid #D2D6DE; border-radius: 4px; font-size: 15px; transition: all 0.2s; background-color: #FAFAFA; }
        .form-group input:focus { outline: none; border-color: var(--primary); background-color: white; box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1); }
        
        .login-btn { width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { background-color: var(--secondary); }
        .login-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #error-msg { color: var(--danger); font-size: 14px; font-weight: 600; margin-top: 15px; text-align: center; display: none; }

        @media (max-width: 768px) { body { flex-direction: column; } .brand-section { display: none; } .login-section { flex: 1; } }
    </style>
</head>
<body>
    <!-- الجزء الخاص بالبراند -->
    <div class="brand-section">
        <h1>Maintenance System</h1>
        <p>نظام إدارة الصيانة والأصول</p>
    </div>

    <!-- الجزء الخاص بالفورم -->
    <div class="login-section">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="login-btn" id="submit-btn">دخول</button>
                <div id="error-msg"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            errorMsg.style.display = 'none';
            submitBtn.innerHTML = 'جاري التحقق...';
            submitBtn.disabled = true;

            // البحث عن المستخدم
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();

            if (error) {
                errorMsg.innerText = "حدث خطأ في الاتصال بالخادم.";
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = 'دخول';
                submitBtn.disabled = false;
                return;
            }

            if (!data) {
                errorMsg.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = 'دخول';
                submitBtn.disabled = false;
                return;
            }

            // تسجيل الدخول بنجاح
            localStorage.setItem('user', JSON.stringify(data));
            
            // التوجيه حسب الصلاحية
            if (data.role === 'admin') {
                window.location.href = 'admin.html';
            } else if (data.role === 'maintenance_manager') {
                window.location.href = 'maintenance.html';
            } else {
                window.location.href = 'manager.html';
            }
        });
    </script>
</body>
</html>

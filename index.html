<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #2C3E50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { color: #2C3E50; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Cairo'; }
        button { width: 100%; padding: 10px; background-color: #3498DB; color: white; border: none; border-radius: 4px; font-weight: bold; font-family: 'Cairo'; cursor: pointer; }
        button:hover { background-color: #2980B9; }
        #error { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Maintenance System</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" id="btn">دخول</button>
            <div id="error"></div>
        </form>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const err = document.getElementById('error');
            btn.innerText = 'جاري التحقق...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // محاولة الدخول
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .single(); // single بتجيب صف واحد بس

            // لو فيه خطأ أو البيانات فاضية
            if (error || !data) {
                err.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                err.style.display = 'block';
                btn.innerText = 'دخول';
                return;
            }

            // لو دخل صح
            localStorage.setItem('user', JSON.stringify(data));
            
            if (data.role === 'admin') window.location.href = 'admin.html';
            else if (data.role === 'maintenance_manager') window.location.href = 'maintenance.html';
            else window.location.href = 'manager.html';
        };
    </script>
</body>
</html>

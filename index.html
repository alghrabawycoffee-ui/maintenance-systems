    <script type="module">
        import { supabase } from './js/supabase.js'
        
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            const err = document.getElementById('error-msg');
            
            btn.innerText = 'جاري التحقق...'; 
            btn.disabled = true; 
            err.style.display = 'none';
            
            // طباعة في الكونسول عشان نشوف بيحصل إيه
            console.log("بيانات الدخول:", username, password);

            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();
            
            // طباعة النتيجة
            console.log("البيانات اللي رجعت:", data);
            console.log("الخطأ لو موجود:", error);

            if (error) {
                err.innerText = "خطأ في الاتصال: " + error.message; 
                err.style.display = 'block';
                btn.innerText = 'دخول'; 
                btn.disabled = false; 
                return;
            }

            if (!data) {
                err.innerText = "المستخدم غير موجود أو الباسورد غلط!"; 
                err.style.display = 'block';
                btn.innerText = 'دخول'; 
                btn.disabled = false; 
                return;
            }
            
            // لو دخل
            localStorage.setItem('user', JSON.stringify(data));
            if (data.role === 'admin' || data.role === 'maintenance_manager') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'manager.html';
            }
        };
    </script>

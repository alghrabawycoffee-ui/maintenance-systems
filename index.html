<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الغرباوي | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #9A4632; --brand-dark: #7A3626; --bg: #F8F6F4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg); }
        .brand-section { flex: 1; background-color: var(--brand); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; position: relative; overflow: hidden; }
        .brand-section img { width: 200px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .brand-section h1 { color: white; font-size: 36px; font-weight: 800; letter-spacing: 1px; }
        .brand-section p { color: rgba(255,255,255,0.8); margin-top: 10px; font-size: 18px; }
        .login-section { flex: 1; display: flex; justify-content: center; align-items: center; background-color: white; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; }
        .login-box h2 { font-size: 28px; font-weight: 800; color: var(--brand-dark); margin-bottom: 8px; }
        .login-box p { color: #777; margin-bottom: 30px; font-size: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #E5E7EB; border-radius: 8px; font-size: 15px; transition: all 0.2s; background-color: #F9FAFB; }
        .form-group input:focus { outline: none; border-color: var(--brand); background-color: white; box-shadow: 0 0 0 4px rgba(154, 70, 50, 0.1); }
        .login-btn { width: 100%; padding: 15px; background-color: var(--brand); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { background-color: var(--brand-dark); }
        .login-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #error-msg { color: #DC2626; font-size: 14px; font-weight: 600; margin-top: 15px; text-align: center; display: none; }
        @media (max-width: 768px) { body { flex-direction: column; } .brand-section { display: none; } .login-section { flex: 1; } }
    </style>
</head>
<body>
    <div class="brand-section">
        <img id="login-logo" src="logo.jpg" alt="الغرباوي" onerror="this.style.display='none'">
        <h1 id="login-company-name">الغرباوي</h1>
        <p>نظام إدارة الصيانة والعهد</p>
    </div>
    <div class="login-section">
        <div class="login-box">
            <h2>مرحباً بعودتك</h2>
            <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
            <form id="login-form">
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="username" required autocomplete="username"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" required autocomplete="current-password"></div>
                <button type="submit" class="login-btn" id="submit-btn">تسجيل الدخول</button>
                <div id="error-msg"></div>
            </form>
        </div>
    </div>
    <script type="module">
        import { supabase } from './js/supabase.js'
        
        async function loadSettings() {
            const { data } = await supabase.from('settings').select('*').eq('id', 1).single();
            if(data) {
                document.documentElement.style.setProperty('--brand', data.primary_color);
                document.getElementById('login-company-name').innerText = data.company_name;
                document.getElementById('login-logo').src = data.logo_url;
            }
        }
        loadSettings();

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            errorMsg.style.display = 'none';
            submitBtn.innerHTML = 'جاري التحقق...'; submitBtn.disabled = true;

            // بنجيب اليوزر من الداتابيز
            const { data, error } = await supabase.from('users').select('*').eq('username', username).eq('password', password).single();

            // لو فيه خطأ أو مفيش بيانات
            if (error || !data) {
                errorMsg.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!"; 
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = 'تسجيل الدخول'; 
                submitBtn.disabled = false; 
                return;
            }

            // تسجيل الدخول بنجاح، بنحفظ البيانات
            localStorage.setItem('user', JSON.stringify(data));
            
            // التوجيه الذكي
            if (data.role === 'admin' || data.role === 'maintenance_manager') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'manager.html';
            }
        });
    </script>
</body>
</html>

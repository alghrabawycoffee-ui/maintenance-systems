<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #2C3E50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { color: #2C3E50; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Cairo'; }
        button { width: 100%; padding: 10px; background-color: #3498DB; color: white; border: none; border-radius: 4px; font-weight: bold; font-family: 'Cairo'; cursor: pointer; }
        button:hover { background-color: #2980B9; }
        #error { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Maintenance System</h2>
        <div id="login-form">
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button type="button" id="login-btn">دخول</button>
            <div id="error"></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'

        document.getElementById('login-btn').addEventListener('click', async () => {
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error');
            btn.innerText = 'جاري التحقق...';
            btn.disabled = true;
            err.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                err.innerText = "الرجاء إدخال البيانات";
                err.style.display = 'block';
                btn.innerText = 'دخول'; btn.disabled = false;
                return;
            }

            console.log("محاولة دخول بـ:", username, password);

            // البحث عن المستخدم
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle(); 

            console.log("النتيجة:", data);
            console.log("الخطأ:", error);

            if (error) {
                err.innerText = "خطأ في الاتصال: " + error.message;
                err.style.display = 'block';
                btn.innerText = 'دخول'; btn.disabled = false;
                return;
            }

            if (!data) {
                err.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                err.style.display = 'block';
                btn.innerText = 'دخول'; btn.disabled = false;
                return;
            }

            // تسجيل الدخول
            localStorage.setItem('user', JSON.stringify(data));
            
            const userRole = data.role.toLowerCase().trim();
            console.log("الصلاحية:", userRole);

            if (userRole === 'admin') {
                window.location.href = 'admin.html';
            } else if (userRole === 'maintenance_manager') {
                window.location.href = 'maintenance.html';
            } else {
                window.location.href = 'manager.html';
            }
        });
    </script>
</body>
</html>

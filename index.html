<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #2C3E50 0%, #1A252F 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: #fff; 
            padding: 40px; 
            border-radius: 12px; 
            width: 350px; 
            max-width: 90%; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        h2 { 
            color: #2C3E50; 
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 24px;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: 'Cairo'; 
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #3498DB;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #3498DB; 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-family: 'Cairo'; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { 
            background: #2980B9; 
        }
        button:disabled { 
            background: #95A5A6; 
            cursor: not-allowed; 
        }
        #error { 
            color: #DD4B39; 
            font-size: 14px; 
            margin-top: 15px; 
            display: none; 
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2><i class="fas fa-tools" style="color:#3498DB;"></i> Maintenance</h2>
        <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
        <button type="button" id="login-btn">دخول</button>
        <div id="error"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')

        document.getElementById('login-btn').addEventListener('click', async () => {
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            err.style.display = 'none';
            if (!username || !password) {
                err.innerText = 'الرجاء إدخال البيانات'; err.style.display = 'block'; return;
            }

            btn.innerText = 'جاري التحقق...'; btn.disabled = true;

            const email = `${username.toLowerCase().trim()}@system.local`;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                err.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة';
                err.style.display = 'block';
                btn.innerText = 'دخول'; btn.disabled = false;
                return;
            }

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
            
            if (profile?.role === 'admin') window.location.replace('admin.html');
            else if (profile?.role === 'maintenance') window.location.replace('maintenance.html');
            else window.location.replace('branch.html');
        });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>

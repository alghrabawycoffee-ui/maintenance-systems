<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | الأدمن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --glpi-navbar: #2C3E50; --glpi-sidebar: #222D32; --glpi-bg: #F4F6F9; --glpi-accent: #3498DB; --glpi-border: #D2D6DE; --glpi-danger: #DD4B39; --glpi-success: #00A65A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background: var(--glpi-bg); color: #333; font-size: 14px; overflow: hidden; }
        .sidebar { width: 250px; background: var(--glpi-sidebar); color: #B8C7CE; display: flex; flex-direction: column; }
        .sidebar-header { height: 60px; background: #1A2226; display: flex; align-items: center; padding: 0 20px; font-size: 18px; font-weight: 700; color: white; border-bottom: 1px solid #111; }
        .sidebar-header i { color: var(--glpi-accent); margin-left: 10px; }
        .nav-menu { padding: 10px 0; flex-grow: 1; }
        .nav-btn { display: flex; align-items: center; padding: 14px 20px; background: none; border: none; color: #B8C7CE; text-align: right; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; transition: 0.2s; border-right: 4px solid transparent; }
        .nav-btn i { width: 30px; text-align: center; margin-left: 10px; }
        .nav-btn:hover, .nav-btn.active { background: #1A2226; color: white; border-right-color: var(--glpi-accent); }
        .sidebar-footer { padding: 15px; border-top: 1px solid #111; }
        .logout-btn { width: 100%; padding: 12px; background: var(--glpi-danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { height: 60px; background: var(--glpi-navbar); color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
        .user-profile { font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .content-body { flex: 1; padding: 25px; overflow-y: auto; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--glpi-navbar); margin-bottom: 25px; border-bottom: 2px solid var(--glpi-border); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .table-container { background: white; border: 1px solid var(--glpi-border); border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        .table-header { padding: 15px 20px; background: #F9F9F9; border-bottom: 1px solid var(--glpi-border); font-weight: 700; color: var(--glpi-navbar); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; padding: 12px 20px; font-size: 13px; color: var(--glpi-navbar); border-bottom: 2px solid var(--glpi-border); background: #F4F6F9; }
        td { padding: 12px 20px; border-bottom: 1px solid var(--glpi-border); color: #555; }
        tbody tr:nth-child(even) { background: #FAFAFA; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; font-family: 'Cairo'; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--glpi-navbar); color: white; }
        .btn-success { background: var(--glpi-success); color: white; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; color: var(--glpi-navbar); }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--glpi-border); border-radius: 4px; font-family: 'Cairo'; font-size: 14px; outline: none; background: #FAFAFA; }
        .tab { display: none; } .tab.active { display: block; }
        .badge { padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; color: white; }
        .bg-green { background: var(--glpi-success); }
        .bg-red { background: var(--glpi-danger); }
        .bg-blue { background: #3498DB; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><i class="fas fa-shield-alt"></i> Admin Panel</div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="showTab('branches', this)"><i class="fas fa-store"></i> الفروع</button>
            <button class="nav-btn" onclick="showTab('users', this)"><i class="fas fa-users"></i> المستخدمين</button>
        </div>
        <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button></div>
    </div>

    <div class="main-content">
        <div class="top-header">
            <div class="user-profile"><span id="header-username">مدير النظام</span><i class="fas fa-user-circle" style="font-size:24px;"></i></div>
        </div>

        <div class="content-body">
            <!-- تبويب الفروع -->
            <div id="tab-branches" class="tab active">
                <div class="page-title"><span><i class="fas fa-store"></i> إدارة الفروع</span></div>
                <div class="table-container">
                    <table id="tbl-branches"><thead><tr><th>#</th><th>اسم الفرع</th><th>الكود</th><th>الإجراء</th></tr></thead><tbody></tbody></table>
                </div>
            </div>

            <!-- تبويب المستخدمين -->
            <div id="tab-users" class="tab">
                <div class="page-title"><span><i class="fas fa-users"></i> إدارة المستخدمين</span></div>
                <div class="table-container">
                    <table id="tbl-users"><thead><tr><th>اسم المستخدم</th><th>الاسم بالكامل</th><th>الدور</th><th>الفرع</th><th>الإجراء</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تعديل الفرع -->
    <div id="edit-branch-modal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
        <div class="table-container" style="width: 400px; padding: 20px; margin: 0;">
            <h3 style="margin-bottom: 20px; color: var(--glpi-navbar);">تعديل اسم الفرع</h3>
            <input type="hidden" id="edit-branch-id">
            <div class="form-group">
                <label class="form-label">اسم الفرع</label>
                <input type="text" id="edit-branch-name" class="form-control">
            </div>
            <button class="btn btn-primary" onclick="saveBranch()" style="width: 100%;">حفظ التعديلات</button>
            <button class="btn" onclick="document.getElementById('edit-branch-modal').style.display='none'" style="width: 100%; margin-top: 10px; background: #ccc;">إلغاء</button>
        </div>
    </div>

    <!-- مودال تعديل المستخدم -->
    <div id="edit-user-modal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
        <div class="table-container" style="width: 400px; padding: 20px; margin: 0;">
            <h3 style="margin-bottom: 20px; color: var(--glpi-navbar);">تعديل بيانات المستخدم</h3>
            <input type="hidden" id="edit-user-id">
            <div class="form-group">
                <label class="form-label">الاسم بالكامل</label>
                <input type="text" id="edit-user-fullname" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور الجديدة (اتركها فارغة إذا لا تريد التغيير)</label>
                <input type="password" id="edit-user-password" class="form-control">
            </div>
            <button class="btn btn-primary" onclick="saveUser()" style="width: 100%;">حفظ التعديلات</button>
            <button class="btn" onclick="document.getElementById('edit-user-modal').style.display='none'" style="width: 100%; margin-top: 10px; background: #ccc;">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')
        
        let userProfile = null;
        
        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) { window.location.replace('index.html'); return; }
            
            const { data } = await supabase.from('profiles').select('*, branches(name)').eq('id', user.id).single();
            userProfile = data;

            if(userProfile?.role !== 'admin') { window.location.replace('index.html'); return; }
            document.getElementById('header-username').innerText = userProfile.full_name;
            loadData();
        }
        init();

        window.logout = async () => { await supabase.auth.signOut(); window.location.replace('index.html'); }
        
        window.showTab = (id, btn) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        async function loadData() {
            // جلب الفروع
            const { data: branches } = await supabase.from('branches').select('*').order('id');
            const tbodyB = document.querySelector('#tbl-branches tbody'); tbodyB.innerHTML = '';
            branches?.forEach(b => {
                tbodyB.innerHTML += `<tr><td>${b.id}</td><td>${b.name}</td><td>${b.code}</td><td><button class="btn btn-primary" onclick="editBranch(${b.id}, '${b.name}')">تعديل</button></td></tr>`;
            });

            // جلب المستخدمين
            const { data: users } = await supabase.from('profiles').select('*, branches(name)').order('created_at');
            const tbodyU = document.querySelector('#tbl-users tbody'); tbodyU.innerHTML = '';
            users?.forEach(u => {
                let roleName = u.role === 'admin' ? 'أدمن' : u.role === 'maintenance' ? 'صيانة' : 'فرع';
                let branchName = u.branches?.name || '-';
                tbodyU.innerHTML += `<tr>
                    <td>${u.username}</td>
                    <td>${u.full_name}</td>
                    <td><span class="badge ${u.role === 'admin' ? 'bg-red' : u.role === 'maintenance' ? 'bg-blue' : 'bg-green'}">${roleName}</span></td>
                    <td>${branchName}</td>
                    <td><button class="btn btn-primary" onclick="editUser('${u.id}', '${u.full_name}')">تعديل</button></td>
                </tr>`;
            });
        }

        // --- إدارة الفروع ---
        window.editBranch = (id, name) => {
            document.getElementById('edit-branch-id').value = id;
            document.getElementById('edit-branch-name').value = name;
            document.getElementById('edit-branch-modal').style.display = 'flex';
        }

        window.saveBranch = async () => {
            const id = document.getElementById('edit-branch-id').value;
            const name = document.getElementById('edit-branch-name').value;
            if(!name) return alert('اكتب اسم الفرع');
            
            await supabase.from('branches').update({ name }).eq('id', id);
            document.getElementById('edit-branch-modal').style.display = 'none';
            loadData();
        }

        // --- إدارة المستخدمين ---
        window.editUser = (id, fullname) => {
            document.getElementById('edit-user-id').value = id;
            document.getElementById('edit-user-fullname').value = fullname;
            document.getElementById('edit-user-password').value = '';
            document.getElementById('edit-user-modal').style.display = 'flex';
        }

        window.saveUser = async () => {
            const id = document.getElementById('edit-user-id').value;
            const fullname = document.getElementById('edit-user-fullname').value;
            const password = document.getElementById('edit-user-password').value;
            
            if(!fullname) return alert('اكتب الاسم');

            // تحديث الاسم في جدول البروفايل
            await supabase.from('profiles').update({ full_name: fullname }).eq('id', id);

            // تحديث الباسورد (لو مكتوب باسورد جديد)
            if(password) {
                // في Supabase، تغيير باسورد مستخدم تاني بيتطلب صلاحيات أدمن، وهنا بنستخدم الـ API المخصص
                const { error } = await supabase.auth.admin.updateUserById(id, { password: password });
                if(error) alert('تم تحديث الاسم، لكن حدث خطأ في تغيير الباسورد: ' + error.message);
            }

            document.getElementById('edit-user-modal').style.display = 'none';
            loadData();
            alert('تم حفظ التعديلات بنجاح');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | نظام الغرباوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --brand: #9A4632; --brand-dark: #7A3626; --sidebar: #2D1B16; --bg: #F3F4F6; --text: #1F2937; --border: #E5E7EB; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header img { width: 100px; border-radius: 8px; margin-bottom: 10px; }
        .sidebar-header h2 { color: white; font-size: 20px; font-weight: 700; }
        .nav-menu { padding: 20px 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .nav-item { padding: 12px 20px; color: #D1D5DB; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; background: transparent; border: none; text-align: right; font-size: 15px; }
        .nav-item:hover, .nav-item.active { background: var(--brand); color: white; }
        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-btn { width: 100%; padding: 12px; background: rgba(220,38,38,0.1); color: #FCA5A5; border: 1px solid rgba(220,38,38,0.2); border-radius: 8px; cursor: pointer; font-weight: 700; }
        .logout-btn:hover { background: #DC2626; color: white; }

        /* Main Content */
        .main { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-title { font-size: 26px; font-weight: 800; color: var(--sidebar); }
        .user-badge { background: white; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); font-weight: 700; color: var(--brand); }

        /* Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); border-top: 4px solid var(--brand); }
        .stat-title { font-size: 14px; color: #6B7280; font-weight: 700; margin-bottom: 8px; }
        .stat-value { font-size: 30px; font-weight: 800; color: var(--sidebar); }

        /* Tables & Boxes */
        .content-box { background: white; border-radius: 12px; border: 1px solid var(--border); display: none; margin-bottom: 30px; }
        .content-box.active { display: block; }
        .box-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; flex-wrap: wrap; gap: 10px; }
        .box-title { font-size: 18px; font-weight: 700; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #F9FAFB; padding: 15px; font-size: 13px; color: #6B7280; border-bottom: 1px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        
        /* Badges & Buttons */
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .bg-success { background: #D1FAE5; color: #065F46; }
        .bg-danger { background: #FEE2E2; color: #991B1B; }
        .bg-warning { background: #FEF3C7; color: #92400E; }
        .bg-gray { background: #F3F4F6; color: #374151; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; font-family: 'Cairo', sans-serif; }
        .btn-brand { background: var(--brand); color: white; }
        .btn-brand:hover { background: var(--brand-dark); }
        .btn-outline { border: 1px solid var(--border); background: transparent; color: var(--text); }
        .btn-outline:hover { background: #F3F4F6; }
        .btn-danger { background: #FEE2E2; color: #DC2626; }

        /* Forms & Modals */
        .form-control { width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Cairo', sans-serif; background: #FAFAFA; }
        .form-label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 12px; width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; }
        .modal-footer { margin-top: 20px; display: flex; gap: 10px; }

        /* Print Style */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; border: 2px solid #000; padding: 20px; }
            .no-print { display: none !important; }
        }
        #print-area { display: none; }
    </style>
</head>
<body>
    <div class="sidebar no-print">
        <div class="sidebar-header">
            <img id="logo" src="logo.jpg" onerror="this.style.display='none'">
            <h2 id="company-name">الغرباوي</h2>
        </div>
        <div class="nav-menu">
            <button class="nav-item active" onclick="showTab('dashboard')">لوحة القيادة</button>
            <button class="nav-item" onclick="showTab('branches')">إدارة الفروع</button>
            <button class="nav-item" onclick="showTab('assets')">إدارة العهد</button>
            <button class="nav-item" onclick="showTab('tickets')">البلاغات</button>
            <button class="nav-item" onclick="showTab('reports')">التقارير</button>
            <button class="nav-item admin-only" onclick="showTab('users')" style="display:none;">المستخدمين</button>
            <button class="nav-item admin-only" onclick="showTab('settings')" style="display:none;">الإعدادات</button>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </div>
    </div>

    <div class="main no-print">
        <div class="top-bar">
            <h1 class="page-title" id="title">لوحة القيادة</h1>
            <div class="user-badge" id="user-info"></div>
        </div>

        <!-- Dashboard -->
        <div id="tab-dashboard" class="content-box active">
            <div style="padding: 20px;">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-title">إجمالي العهد</div><div class="stat-value" id="st-assets">0</div></div>
                    <div class="stat-card"><div class="stat-title">عهد عطلانة</div><div class="stat-value" style="color:#DC2626;" id="st-broken">0</div></div>
                    <div class="stat-card"><div class="stat-title">بلاغات مفتوحة</div><div class="stat-value" style="color:#D97706;" id="st-tickets">0</div></div>
                    <div class="stat-card"><div class="stat-title">إجمالي التكاليف</div><div class="stat-value" style="color:#059669;" id="st-costs">0 ج.م</div></div>
                </div>
            </div>
        </div>

        <!-- Branches -->
        <div id="tab-branches" class="content-box">
            <div class="box-header">
                <span class="box-title">الفروع</span>
                <button class="btn btn-brand" onclick="document.getElementById('add-branch-form').style.display='flex'">+ إضافة فرع</button>
            </div>
            <div id="add-branch-form" style="display:none; padding:15px; background:#f9fafb; border-bottom:1px solid var(--border);">
                <form id="branch-form" style="display:flex; gap:10px;">
                    <input type="text" id="branch-name" class="form-control" placeholder="اسم الفرع" required>
                    <button type="submit" class="btn btn-brand">حفظ</button>
                </form>
            </div>
            <div class="table-responsive"><table id="tbl-branches"><thead><tr><th>الكود</th><th>الاسم</th><th>تاريخ الإضافة</th></tr></thead><tbody></tbody></table></div>
        </div>

        <!-- Assets -->
        <div id="tab-assets" class="content-box">
            <div class="box-header">
                <span class="box-title">العهد</span>
                <div style="display:flex; gap:10px;">
                    <select id="filter-branch" class="form-control" style="width:150px;" onchange="loadAssets()"><option value="">كل الفروع</option></select>
                    <button class="btn btn-brand" onclick="document.getElementById('add-asset-modal').style.display='flex'">+ إضافة عهدة</button>
                </div>
            </div>
            <div class="table-responsive"><table id="tbl-assets"><thead><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>الفرع</th><th>الحالة</th></tr></thead><tbody></tbody></table></div>
        </div>

        <!-- Tickets -->
        <div id="tab-tickets" class="content-box">
            <div class="box-header"><span class="box-title">البلاغات</span></div>
            <div class="table-responsive"><table id="tbl-tickets"><thead><tr><th>رقم</th><th>الفرع</th><th>العهدة</th><th>الوصف</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody></tbody></table></div>
        </div>

        <!-- Reports -->
        <div id="tab-reports" class="content-box">
            <div class="box-header">
                <span class="box-title">تقارير الصيانة</span>
                <button class="btn btn-outline" onclick="printReport()">🖨️ طباعة التقرير</button>
            </div>
            <div style="padding:20px; display:flex; gap:10px; align-items:end;">
                <div><label class="form-label">الفرع</label><select id="rep-branch" class="form-control"><option value="">كل الفروع</option></select></div>
                <div><label class="form-label">من</label><input type="date" id="rep-from" class="form-control"></div>
                <div><label class="form-label">إلى</label><input type="date" id="rep-to" class="form-control"></div>
                <button class="btn btn-brand" onclick="generateReport()">عرض</button>
            </div>
            <div class="table-responsive" id="report-results"></div>
        </div>

        <!-- Users -->
        <div id="tab-users" class="content-box">
            <div class="box-header">
                <span class="box-title">المستخدمين</span>
                <button class="btn btn-brand" onclick="openUserModal()">+ إضافة مستخدم</button>
            </div>
            <div class="table-responsive"><table id="tbl-users"><thead><tr><th>الاسم</th><th>الصلاحية</th><th>الفرع</th><th>إجراءات</th></tr></thead><tbody></tbody></table></div>
        </div>

        <!-- Settings -->
        <div id="tab-settings" class="content-box">
            <div class="box-header"><span class="box-title">الإعدادات</span></div>
            <div style="padding:20px; max-width:400px;">
                <form id="settings-form">
                    <div class="form-group"><label class="form-label">اسم الشركة</label><input type="text" id="set-name" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">رابط اللوجو</label><input type="text" id="set-logo" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">اللون (Hex)</label><input type="color" id="set-color" class="form-control" style="height:40px;" required></div>
                    <button type="submit" class="btn btn-brand" style="width:100%;">حفظ</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Print Area -->
    <div id="print-area"></div>

    <!-- Modals -->
    <div id="add-asset-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>إضافة عهدة</h3><button class="modal-close" onclick="document.getElementById('add-asset-modal').style.display='none'">&times;</button></div>
            <form id="asset-form">
                <div class="form-group"><label class="form-label">الكود</label><input type="text" id="a-code" class="form-control" required></div>
                <div class="form-group"><label class="form-label">الاسم</label><input type="text" id="a-name" class="form-control" required></div>
                <div class="form-group"><label class="form-label">الفرع</label><select id="a-branch" class="form-control" required></select></div>
                <button type="submit" class="btn btn-brand" style="width:100%;">حفظ</button>
            </form>
        </div>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="u-title">إضافة مستخدم</h3><button class="modal-close" onclick="document.getElementById('user-modal').style.display='none'">&times;</button></div>
            <form id="user-form">
                <input type="hidden" id="u-id">
                <div class="form-group"><label class="form-label">اسم المستخدم</label><input type="text" id="u-name" class="form-control" required></div>
                <div class="form-group"><label class="form-label">كلمة المرور</label><input type="text" id="u-pass" class="form-control" required></div>
                <div class="form-group"><label class="form-label">الصلاحية</label>
                    <select id="u-role" class="form-control" required onchange="toggleBranch()">
                        <option value="branch_manager">مدير فرع</option>
                        <option value="maintenance_manager">مدير صيانة</option>
                        <option value="admin">أدمن</option>
                    </select>
                </div>
                <div class="form-group" id="u-branch-group"><label class="form-label">الفرع</label><select id="u-branch" class="form-control"></select></div>
                <button type="submit" class="btn btn-brand" style="width:100%;">حفظ</button>
            </form>
        </div>
    </div>

    <div id="close-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>إغلاق البلاغ</h3><button class="modal-close" onclick="document.getElementById('close-modal').style.display='none'">&times;</button></div>
            <div class="form-group"><label class="form-label">اسم الفني</label><input type="text" id="t-tech" class="form-control" required></div>
            <div class="form-group"><label class="form-label">التكلفة</label><input type="number" id="t-cost" class="form-control" required></div>
            <input type="hidden" id="t-id">
            <button class="btn btn-brand" style="width:100%;" onclick="closeTicket()">تأكيد الإغلاق</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || (user.role !== 'admin' && user.role !== 'maintenance_manager')) window.location.href = 'index.html';

        // Init
        if(user.role === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
        document.getElementById('user-info').innerText = `👤 ${user.username}`;

        window.logout = () => { localStorage.removeItem('user'); window.location.href = 'index.html'; }
        window.showTab = (id) => {
            document.querySelectorAll('.content-box').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.getElementById('title').innerText = {dashboard:'لوحة القيادة', branches:'الفروع', assets:'العهد', tickets:'البلاغات', reports:'التقارير', users:'المستخدمين', settings:'الإعدادات'}[id];
        }

        // Load Settings & UI
        async function loadSettings() {
            const { data } = await supabase.from('settings').select('*').eq('id', 1).single();
            if(data) {
                document.documentElement.style.setProperty('--brand', data.primary_color);
                document.getElementById('company-name').innerText = data.company_name;
                document.getElementById('logo').src = data.logo_url;
                document.getElementById('set-name').value = data.company_name;
                document.getElementById('set-logo').value = data.logo_url;
                document.getElementById('set-color').value = data.primary_color;
            }
        }
        loadSettings();

        // Load Branches
        async function loadBranches() {
            const { data } = await supabase.from('branches').select('*').order('id');
            const tbody = document.querySelector('#tbl-branches tbody'); tbody.innerHTML = '';
            const fSelect = document.getElementById('filter-branch');
            const aSelect = document.getElementById('a-branch');
            const uSelect = document.getElementById('u-branch');
            const rSelect = document.getElementById('rep-branch');
            
            fSelect.innerHTML = '<option value="">كل الفروع</option>';
            aSelect.innerHTML = ''; uSelect.innerHTML = ''; rSelect.innerHTML = '<option value="">كل الفروع</option>';
            
            data?.forEach(b => {
                tbody.innerHTML += `<tr><td>${b.id}</td><td>${b.name}</td><td>${new Date(b.created_at).toLocaleDateString('ar-EG')}</td></tr>`;
                fSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                aSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                uSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                rSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
            });
        }
        loadBranches();

        document.getElementById('branch-form').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('branches').insert([{ name: document.getElementById('branch-name').value }]);
            location.reload();
        };

        // Assets
        async function loadAssets() {
            const bId = document.getElementById('filter-branch').value;
            let q = supabase.from('assets').select('*, branches(name)');
            if(bId) q = q.eq('branch_id', bId);
            const { data } = await q;
            const tbody = document.querySelector('#tbl-assets tbody'); tbody.innerHTML = '';
            data?.forEach(a => {
                tbody.innerHTML += `<tr><td>${a.code}</td><td>${a.name}</td><td>${a.type||'-'}</td><td>${a.branches?.name}</td><td><span class="badge ${a.status==='working'?'bg-success':'bg-danger'}">${a.status==='working'?'شغال':'عطلان'}</span></td></tr>`;
            });
        }
        document.getElementById('filter-branch').onchange = loadAssets;
        
        document.getElementById('asset-form').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('assets').insert([{ code: document.getElementById('a-code').value, name: document.getElementById('a-name').value, branch_id: document.getElementById('a-branch').value }]);
            document.getElementById('add-asset-modal').style.display = 'none';
            loadAssets();
        };

        // Users
        async function loadUsers() {
            if(user.role !== 'admin') return;
            const { data } = await supabase.from('users').select('*, branches(name)');
            const tbody = document.querySelector('#tbl-users tbody'); tbody.innerHTML = '';
            data?.forEach(u => {
                const role = u.role === 'admin' ? 'أدمن' : (u.role === 'maintenance_manager' ? 'مدير صيانة' : 'مدير فرع');
                tbody.innerHTML += `<tr>
                    <td>${u.username}</td><td>${role}</td><td>${u.branches?.name || 'كل الفروع'}</td>
                    <td>
                        <button class="btn btn-outline" style="padding:4px 8px;" onclick="editUser(${u.id}, '${u.username}', '${u.password}', '${u.role}', ${u.branch_id})">تعديل</button>
                        <button class="btn btn-danger" style="padding:4px 8px;" onclick="delUser(${u.id})">حذف</button>
                    </td>
                </tr>`;
            });
        }
        loadUsers();

        window.openUserModal = () => { document.getElementById('user-form').reset(); document.getElementById('u-id').value=''; document.getElementById('user-modal').style.display='flex'; }
        window.editUser = (id, name, pass, role, bId) => {
            document.getElementById('u-id').value = id; document.getElementById('u-name').value = name;
            document.getElementById('u-pass').value = pass; document.getElementById('u-role').value = role;
            document.getElementById('u-branch').value = bId || '';
            toggleBranch(); document.getElementById('user-modal').style.display='flex';
        }
        window.delUser = async (id) => {
            if(confirm('تأكيد الحذف؟')) { await supabase.from('users').delete().eq('id', id); loadUsers(); }
        }
        window.toggleBranch = () => {
            document.getElementById('u-branch-group').style.display = document.getElementById('u-role').value === 'branch_manager' ? 'block' : 'none';
        }

        document.getElementById('user-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('u-id').value;
            const data = {
                username: document.getElementById('u-name').value, password: document.getElementById('u-pass').value,
                role: document.getElementById('u-role').value, branch_id: document.getElementById('u-branch').value || null
            };
            if(id) await supabase.from('users').update(data).eq('id', id);
            else await supabase.from('users').insert([data]);
            document.getElementById('user-modal').style.display='none';
            loadUsers();
        };

        // Settings
        document.getElementById('settings-form').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('settings').update({
                company_name: document.getElementById('set-name').value,
                logo_url: document.getElementById('set-logo').value,
                primary_color: document.getElementById('set-color').value
            }).eq('id', 1);
            location.reload();
        };

        // Reports & Print
        window.generateReport = async () => {
            const bId = document.getElementById('rep-branch').value;
            const from = document.getElementById('rep-from').value;
            const to = document.getElementById('rep-to').value;
            
            let q = supabase.from('tickets').select('*, branches(name), assets(name), work_orders(costs(amount))');
            if(bId) q = q.eq('branch_id', bId);
            if(from) q = q.gte('created_at', `${from}T00:00:00`);
            if(to) q = q.lte('created_at', `${to}T23:59:59`);

            const { data } = await q;
            let html = '<table><thead><tr><th>الفرع</th><th>العهدة</th><th>التاريخ</th><th>الوصف</th><th>التكلفة</th></tr></thead><tbody>';
            let total = 0;
            
            data?.forEach(t => {
                const cost = t.work_orders?.[0]?.costs?.[0]?.amount || 0;
                total += Number(cost);
                html += `<tr><td>${t.branches?.name}</td><td>${t.assets?.name}</td><td>${new Date(t.created_at).toLocaleDateString('ar-EG')}</td><td>${t.description}</td><td>${cost} ج.م</td></tr>`;
            });
            html += `</tbody></table><h3 style="margin-top:20px;">الإجمالي: ${total} ج.م</h3>`;
            document.getElementById('report-results').innerHTML = html;
            
            // Prepare Print Area
            document.getElementById('print-area').innerHTML = `
                <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px;">
                    <img src="${document.getElementById('logo').src}" style="width:100px;">
                    <h1>${document.getElementById('company-name').innerText}</h1>
                    <h3>تقرير صيانة</h3>
                </div>
                ${html}
            `;
        };

        window.printReport = () => {
            if(!document.getElementById('report-results').innerHTML) return alert('اعرض التقرير أولاً');
            document.getElementById('print-area').style.display = 'block';
            window.print();
            document.getElementById('print-area').style.display = 'none';
        };

        // Tickets
        async function loadTickets() {
            const { data } = await supabase.from('tickets').select('*, branches(name), assets(name)').order('id', {ascending:false});
            const tbody = document.querySelector('#tbl-tickets tbody'); tbody.innerHTML = '';
            data?.forEach(t => {
                let btn = t.status !== 'closed' ? `<button class="btn btn-brand" style="padding:4px 8px;" onclick="openClose(${t.id})">إغلاق</button>` : '';
                tbody.innerHTML += `<tr><td>#${t.id}</td><td>${t.branches?.name}</td><td>${t.assets?.name}</td><td>${t.description}</td><td>${t.status}</td><td>${btn}</td></tr>`;
            });
        }
        loadTickets();
        
        window.openClose = (id) => { document.getElementById('t-id').value=id; document.getElementById('close-modal').style.display='flex'; }
        window.closeTicket = async () => {
            const id = document.getElementById('t-id').value;
            const wo = await supabase.from('work_orders').insert([{ ticket_id: id, technician_name: document.getElementById('t-tech').value, status: 'done' }]).select().single();
            if(wo.data) {
                await supabase.from('costs').insert([{ work_order_id: wo.data.id, amount: document.getElementById('t-cost').value }]);
                await supabase.from('tickets').update({status:'closed'}).eq('id', id);
            }
            document.getElementById('close-modal').style.display='none';
            loadTickets();
        };

        // Dashboard
        async function loadDash() {
            const { data: a } = await supabase.from('assets').select('status');
            const { data: t } = await supabase.from('tickets').select('status');
            const { data: c } = await supabase.from('costs').select('amount');
            if(a) { document.getElementById('st-assets').innerText = a.length; document.getElementById('st-broken').innerText = a.filter(x=>x.status==='broken').length; }
            if(t) document.getElementById('st-tickets').innerText = t.filter(x=>x.status!=='closed').length;
            if(c) document.getElementById('st-costs').innerText = c.reduce((s,x)=>s+Number(x.amount),0) + ' ج.م';
        }
        loadDash();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الغرباوي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #9A4632; --sidebar: #2D1B16; --bg: #F3F4F6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg); }
        .sidebar { width: 250px; background: var(--sidebar); color: white; display: flex; flex-direction: column; }
        .sidebar h2 { padding: 20px; text-align: center; border-bottom: 1px solid #444; }
        .nav-btn { padding: 15px; background: none; border: none; color: #ccc; text-align: right; cursor: pointer; font-size: 16px; }
        .nav-btn.active { background: var(--brand); color: white; }
        .main { flex: 1; padding: 20px; overflow-y: auto; }
        .tab { display: none; background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .tab.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: right; }
        th { background: #f9fafb; }
        .input { padding: 10px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { padding: 10px 20px; background: var(--brand); color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>الغرباوي</h2>
        <button class="nav-btn active" onclick="showTab('dash')">لوحة القيادة</button>
        <button class="nav-btn" onclick="showTab('branches')">الفروع</button>
        <button class="nav-btn" onclick="showTab('assets')">العهد</button>
        <button class="nav-btn" onclick="showTab('users')">المستخدمين</button>
        <div style="margin-top: auto; padding: 20px;">
            <button class="btn" style="background: #DC2626; width: 100%;" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="main">
        <!-- Dashboard -->
        <div id="tab-dash" class="tab active">
            <h2>مرحباً بك في لوحة القيادة</h2>
            <p id="user-info" style="margin-top: 20px;"></p>
        </div>

        <!-- Branches -->
        <div id="tab-branches" class="tab">
            <h3>الفروع</h3>
            <input type="text" id="branch-name" class="input" placeholder="اسم الفرع">
            <button class="btn" onclick="addBranch()">إضافة فرع</button>
            <table id="tbl-branches"><thead><tr><th>ID</th><th>الاسم</th></tr></thead><tbody></tbody></table>
        </div>

        <!-- Assets -->
        <div id="tab-assets" class="tab">
            <h3>العهد</h3>
            <input type="text" id="a-code" class="input" placeholder="كود العهدة">
            <input type="text" id="a-name" class="input" placeholder="اسم العهدة">
            <select id="a-branch" class="input"></select>
            <button class="btn" onclick="addAsset()">إضافة عهدة</button>
            <table id="tbl-assets"><thead><tr><th>الكود</th><th>الاسم</th><th>الفرع</th><th>الحالة</th></tr></thead><tbody></tbody></table>
        </div>

        <!-- Users -->
        <div id="tab-users" class="tab">
            <h3>المستخدمين</h3>
            <input type="text" id="u-name" class="input" placeholder="اسم المستخدم">
            <input type="text" id="u-pass" class="input" placeholder="كلمة المرور">
            <select id="u-role" class="input">
                <option value="branch_manager">مدير فرع</option>
                <option value="maintenance_manager">مدير صيانة</option>
                <option value="admin">أدمن</option>
            </select>
            <select id="u-branch" class="input"></select>
            <button class="btn" onclick="addUser()">إضافة مستخدم</button>
            <table id="tbl-users"><thead><tr><th>الاسم</th><th>الصلاحية</th><th>الفرع</th><th>حذف</th></tr></thead><tbody></tbody></table>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'
        const user = JSON.parse(localStorage.getItem('user'));
        if(!user) window.location.href = 'index.html';

        document.getElementById('user-info').innerText = `مرحباً، ${user.username} (${user.role})`;

        window.logout = () => { localStorage.removeItem('user'); window.location.href = 'index.html'; }
        window.showTab = (id) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
        }

        async function loadData() {
            // تحميل الفروع
            const { data: branches } = await supabase.from('branches').select('*');
            const tbodyB = document.querySelector('#tbl-branches tbody'); tbodyB.innerHTML = '';
            const selB = document.getElementById('a-branch');
            const selU = document.getElementById('u-branch');
            selB.innerHTML = ''; selU.innerHTML = '';
            
            branches?.forEach(b => {
                tbodyB.innerHTML += `<tr><td>${b.id}</td><td>${b.name}</td></tr>`;
                selB.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                selU.innerHTML += `<option value="${b.id}">${b.name}</option>`;
            });

            // تحميل العهد
            const { data: assets } = await supabase.from('assets').select('*, branches(name)');
            const tbodyA = document.querySelector('#tbl-assets tbody'); tbodyA.innerHTML = '';
            assets?.forEach(a => {
                tbodyA.innerHTML += `<tr><td>${a.code}</td><td>${a.name}</td><td>${a.branches?.name || '-'}</td><td>${a.status}</td></tr>`;
            });

            // تحميل المستخدمين
            const { data: users } = await supabase.from('users').select('*, branches(name)');
            const tbodyU = document.querySelector('#tbl-users tbody'); tbodyU.innerHTML = '';
            users?.forEach(u => {
                tbodyU.innerHTML += `<tr><td>${u.username}</td><td>${u.role}</td><td>${u.branches?.name || 'كل الفروع'}</td>
                <td><button onclick="delUser(${u.id})" style="color:red; border:none; background:none; cursor:pointer;">حذف</button></td></tr>`;
            });
        }
        loadData();

        window.addBranch = async () => {
            const name = document.getElementById('branch-name').value;
            if(name) { await supabase.from('branches').insert([{ name }]); document.getElementById('branch-name').value = ''; loadData(); }
        };

        window.addAsset = async () => {
            const code = document.getElementById('a-code').value;
            const name = document.getElementById('a-name').value;
            const branch_id = document.getElementById('a-branch').value;
            if(code && name) { await supabase.from('assets').insert([{ code, name, branch_id }]); loadData(); }
        };

        window.addUser = async () => {
            const username = document.getElementById('u-name').value;
            const password = document.getElementById('u-pass').value;
            const role = document.getElementById('u-role').value;
            const branch_id = role === 'branch_manager' ? document.getElementById('u-branch').value : null;
            if(username && password) {
                await supabase.from('users').insert([{ username, password, role, branch_id }]);
                loadData();
            }
        };

        window.delUser = async (id) => {
            if(confirm('تأكيد الحذف؟')) { await supabase.from('users').delete().eq('id', id); loadData(); }
        };
    </script>
</body>
</html>s

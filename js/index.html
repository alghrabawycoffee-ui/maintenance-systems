<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الغرباوي | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #9A4632; --bg: #F8F6F4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg); }
        .brand-section { flex: 1; background-color: var(--brand); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .brand-section h1 { font-size: 36px; font-weight: 800; }
        .login-section { flex: 1; display: flex; justify-content: center; align-items: center; background: white; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .login-btn { width: 100%; padding: 15px; background: var(--brand); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        #error-msg { color: red; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="brand-section">
        <h1>الغرباوي</h1>
        <p>نظام إدارة الصيانة</p>
    </div>
    <div class="login-section">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <form id="login-form">
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="username" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" required></div>
                <button type="submit" class="login-btn" id="submit-btn">دخول</button>
                <div id="error-msg"></div>
            </form>
        </div>
    </div>
    <script type="module">
        import { supabase } from './js/supabase.js'
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            const err = document.getElementById('error-msg');
            
            btn.innerText = 'جاري التحقق...'; btn.disabled = true; err.style.display = 'none';
            
            const { data, error } = await supabase.from('users').select('*').eq('username', username).eq('password', password).maybeSingle();
            
            if (error || !data) {
                err.innerText = "بيانات الدخول غلط أو المستخدم غير موجود"; err.style.display = 'block';
                btn.innerText = 'دخول'; btn.disabled = false; return;
            }
            localStorage.setItem('user', JSON.stringify(data));
            
            if (data.role === 'admin' || data.role === 'maintenance_manager') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'manager.html';
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الأدمن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; }
        .header { background: #343a40; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>لوحة تحكم الأدمن</h2>
        <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
    </div>

    <div style="margin-top: 20px; background: white; padding: 20px; border-radius: 8px;">
        <h3 id="welcome-msg">أهلاً بيك...</h3>
        <p>من هنا هتقدر تضيف فروع، تشوف البلاغات، وتدير السيستم.</p>
    </div>

    <script>
        // التأكد إن اللي داخل أدمن فعلاً
        const user = JSON.parse(localStorage.getItem('user'));

        if (!user || user.role !== 'admin') {
            window.location.href = 'index.html'; // لو مش أدمن يطرده لصفحة الدخول
        } else {
            document.getElementById('welcome-msg').innerText = `أهلاً بيك يا ${user.username} في لوحة التحكم`;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System | مدير الفرع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --glpi-navbar: #2C3E50; --glpi-sidebar: #222D32; --glpi-bg: #F4F6F9; --glpi-accent: #3498DB; --glpi-border: #D2D6DE; --glpi-danger: #DD4B39; --glpi-success: #00A65A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { display: flex; height: 100vh; background: var(--glpi-bg); color: #333; font-size: 14px; overflow: hidden; }
        .sidebar { width: 250px; background: var(--glpi-sidebar); color: #B8C7CE; display: flex; flex-direction: column; }
        .sidebar-header { height: 60px; background: #1A2226; display: flex; align-items: center; padding: 0 20px; font-size: 18px; font-weight: 700; color: white; border-bottom: 1px solid #111; }
        .sidebar-header i { color: var(--glpi-accent); margin-left: 10px; }
        .nav-menu { padding: 10px 0; flex-grow: 1; }
        .nav-btn { display: flex; align-items: center; padding: 14px 20px; background: none; border: none; color: #B8C7CE; text-align: right; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; transition: 0.2s; border-right: 4px solid transparent; }
        .nav-btn i { width: 30px; text-align: center; margin-left: 10px; }
        .nav-btn:hover, .nav-btn.active { background: #1A2226; color: white; border-right-color: var(--glpi-accent); }
        .sidebar-footer { padding: 15px; border-top: 1px solid #111; }
        .logout-btn { width: 100%; padding: 12px; background: var(--glpi-danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { height: 60px; background: var(--glpi-navbar); color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
        .user-profile { font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .content-body { flex: 1; padding: 25px; overflow-y: auto; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--glpi-navbar); margin-bottom: 25px; border-bottom: 2px solid var(--glpi-border); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .table-container { background: white; border: 1px solid var(--glpi-border); border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        .table-header { padding: 15px 20px; background: #F9F9F9; border-bottom: 1px solid var(--glpi-border); font-weight: 700; color: var(--glpi-navbar); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; padding: 12px 20px; font-size: 13px; color: var(--glpi-navbar); border-bottom: 2px solid var(--glpi-border); background: #F4F6F9; }
        td { padding: 12px 20px; border-bottom: 1px solid var(--glpi-border); color: #555; }
        tbody tr:nth-child(even) { background: #FAFAFA; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; font-family: 'Cairo'; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--glpi-navbar); color: white; }
        .btn-success { background: var(--glpi-success); color: white; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; color: var(--glpi-navbar); }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--glpi-border); border-radius: 4px; font-family: 'Cairo'; font-size: 14px; outline: none; background: #FAFAFA; }
        .tab { display: none; } .tab.active { display: block; }
        .badge { padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; color: white; }
        .bg-green { background: var(--glpi-success); }
        .bg-red { background: var(--glpi-danger); }
        .bg-orange { background: #F39C12; }
        .bg-blue { background: #3498DB; }
        .bg-purple { background: #9b59b6; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 500px; border-radius: 8px; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glpi-border); padding-bottom: 15px; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #777; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><i class="fas fa-tools"></i> Maintenance</div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="showTab('tickets', this)"><i class="fas fa-ticket-alt"></i> تذاكر الفرع</button>
            <button class="nav-btn" onclick="showTab('assets', this)"><i class="fas fa-desktop"></i> أصول الفرع</button>
            <button class="nav-btn" onclick="showTab('asset-history', this)"><i class="fas fa-history"></i> سجل الأصول</button>
            <button class="nav-btn" onclick="showTab('custody', this)"><i class="fas fa-box-open"></i> العهد الجديدة</button>
        </div>
        <div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button></div>
    </div>

    <div class="main-content">
        <div class="top-header">
            <div class="user-profile"><span id="header-username">مدير فرع</span><i class="fas fa-user-circle" style="font-size:24px;"></i></div>
        </div>

        <div class="content-body">
            <div id="tab-tickets" class="tab active">
                <div class="page-title"><span><i class="fas fa-ticket-alt"></i> تذاكر الفرع</span></div>
                <div class="table-container">
                    <div class="table-header"><span>إرسال بلاغ جديد</span></div>
                    <div style="padding:20px;">
                        <div class="form-grid">
                            <div class="form-group"><label class="form-label">الأصل (العهدة)</label><select id="t-asset" class="form-control"></select></div>
                            <div class="form-group"><label class="form-label">تصنيف العطل</label>
                                <select id="t-cat" class="form-control">
                                    <option value="كهرباء">كهرباء</option>
                                    <option value="تكييف">تكييف</option>
                                    <option value="سباكة">سباكة</option>
                                    <option value="شبكات">شبكات</option>
                                    <option value="أثاث">أثاث</option>
                                    <option value="أخرى">أخرى</option>
                                </select>
                            </div>
                            <div class="form-group"><label class="form-label">الأولوية</label>
                                <select id="t-priority" class="form-control">
                                    <option value="normal">عادية</option>
                                    <option value="high">مهمة</option>
                                    <option value="urgent">طارئة جداً</option>
                                </select>
                            </div>
                            <div class="form-group"><label class="form-label">صورة للمشكلة (اختياري)</label><input type="file" id="t-image" class="form-control" accept="image/*"></div>
                        </div>
                        <div class="form-group"><label class="form-label">وصف المشكلة</label><textarea id="t-desc" class="form-control" rows="3"></textarea></div>
                        <button class="btn btn-primary" onclick="addTicket()">إرسال البلاغ</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="tbl-tickets"><thead><tr><th>#</th><th>الوصف</th><th>الأصل</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody></tbody></table>
                </div>
            </div>

            <div id="tab-assets" class="tab">
                <div class="page-title"><span><i class="fas fa-desktop"></i> أصول الفرع</span></div>
                <div class="table-container">
                    <div class="table-header">
                        <span>قائمة الأصول</span>
                        <button class="btn btn-success" onclick="openAssetModal()">إضافة أصل جديد (مثال: حنفية)</button>
                    </div>
                    <table id="tbl-assets"><thead><tr><th>الكود</th><th>الاسم</th><th>الحالة</th><th>تاريخ الإضافة</th></tr></thead><tbody></tbody></table>
                </div>
            </div>

            <!-- سجل الأصول (Timeline) -->
            <div id="tab-asset-history" class="tab">
                <div class="page-title"><span><i class="fas fa-history"></i> سجل الأصول (التاريخ الكامل)</span></div>
                <div class="table-container">
                    <div class="table-header"><span>اختر الأصل لرؤية تاريخه</span></div>
                    <div style="padding:20px;">
                        <select id="history-asset-select" class="form-control" onchange="loadAssetHistory()">
                            <option value="">-- اختر أصلاً --</option>
                        </select>
                    </div>
                </div>
                <div id="asset-history-display" style="display: none;">
                    <div class="table-container">
                        <table>
                            <thead><tr><th>التاريخ</th><th>الحدث</th><th>التفاصيل</th></tr></thead>
                            <tbody id="tbl-history-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="tab-custody" class="tab">
                <div class="page-title"><span><i class="fas fa-box-open"></i> العهد المرسلة من الصيانة</span></div>
                <div class="table-container">
                    <table id="tbl-custody"><thead><tr><th>الأصل</th><th>الكود</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal إضافة أصل جديد -->
    <div id="asset-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة أصل جديد للفرع</h3>
                <button class="modal-close" onclick="document.getElementById('asset-modal').style.display='none'">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">اسم الأصل</label>
                <input type="text" id="new-asset-name" class="form-control" placeholder="مثال: حنفية الحمام">
            </div>
            <div class="form-group">
                <label class="form-label">كود الأصل</label>
                <input type="text" id="new-asset-code" class="form-control" placeholder="مثال: PL-01">
            </div>
            <div class="form-group">
                <label class="form-label">التصنيف</label>
                <input type="text" id="new-asset-cat" class="form-control" placeholder="مثال: سباكة">
            </div>
            <button class="btn btn-primary" onclick="saveNewAsset()" style="width:100%;">إضافة الأصل</button>
        </div>
    </div>

    <!-- Modal تأكيد الإصلاح -->
    <div id="approve-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>تأكيد إصلاح التذكرة</h3>
                <button class="modal-close" onclick="document.getElementById('approve-modal').style.display='none'">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">ملاحظات الفرع (إجباري):</label>
                <textarea id="branch-notes-input" class="form-control" rows="3" placeholder="مثال: تم تجربة التكييف وهو يعمل بكفاءة..."></textarea>
            </div>
            <button class="btn btn-success" onclick="submitApproval()" style="width:100%;">تأكيد وإغلاق التذكرة</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')
        
        let userProfile = null;
        let currentApproveTicketId = null;
        let currentApproveAssetId = null;
        let globalAssets = [];
        
        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) { window.location.href = 'index.html'; return; }
            
            const { data } = await supabase.from('profiles').select('*, branches(name)').eq('id', user.id).single();
            userProfile = data;

            if(userProfile?.role !== 'branch') {
                window.location.href = 'index.html'; return;
            }
            document.getElementById('header-username').innerText = userProfile.full_name;
            loadData();
        }
        init();

        window.logout = async () => { 
            await supabase.auth.signOut();
            window.location.href = 'index.html'; 
        }

        window.showTab = (id, btn) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        async function loadData() {
            // الأصول
            const { data: assets } = await supabase.from('assets').select('*').eq('branch_id', userProfile.branch_id);
            globalAssets = assets || [];
            const tbodyA = document.querySelector('#tbl-assets tbody'); tbodyA.innerHTML = '';
            const selA = document.getElementById('t-asset'); selA.innerHTML = '';
            const historySel = document.getElementById('history-asset-select'); historySel.innerHTML = '<option value="">-- اختر أصلاً --</option>';
            
            assets?.forEach(a => {
                tbodyA.innerHTML += `<tr>
                    <td>${a.code}</td>
                    <td>${a.name}</td>
                    <td>${a.status === 'working' ? '<span class="badge bg-green">سليم</span>' : '<span class="badge bg-red">عطلان</span>'}</td>
                    <td>${new Date(a.created_at).toLocaleDateString('ar-EG')}</td>
                </tr>`;
                selA.innerHTML += `<option value="${a.id}">${a.name} (${a.code})</option>`;
                historySel.innerHTML += `<option value="${a.id}">${a.name} (${a.code})</option>`;
            });

            // التذاكر
            const { data: tickets } = await supabase.from('tickets').select('*, assets(name)').eq('branch_id', userProfile.branch_id).order('id', {ascending:false});
            const tbodyT = document.querySelector('#tbl-tickets tbody'); tbodyT.innerHTML = '';
            tickets?.forEach(t => {
                let statusHtml = t.status === 'open' ? '<span class="badge bg-orange">مفتوح</span>' : 
                                 t.status === 'pending_approval' ? '<span class="badge bg-purple">بانتظار تأكيدك</span>' :
                                 t.status === 'closed' ? '<span class="badge bg-green">مغلق</span>' : 
                                 '<span class="badge bg-blue">قيد المعالجة</span>';
                
                let actions = '-';
                if(t.status === 'pending_approval') {
                    actions = `<button class="btn btn-success" style="padding:4px 8px; margin-left:5px;" onclick="openApproveModal(${t.id}, ${t.asset_id})">تم الإصلاح</button>
                               <button class="btn" style="background:var(--glpi-danger); color:white; padding:4px 8px;" onclick="rejectRepair(${t.id})">رفض</button>`;
                }

                tbodyT.innerHTML += `<tr><td>#${t.id}</td><td>${t.description}</td><td>${t.assets?.name}</td><td>${statusHtml}</td><td>${actions}</td></tr>`;
            });

            // العهد
            const { data: custody } = await supabase.from('custody_transfers').select('*').eq('branch_id', userProfile.branch_id).order('id', {ascending:false});
            const tbodyC = document.querySelector('#tbl-custody tbody'); tbodyC.innerHTML = '';
            custody?.forEach(c => {
                let actions = '-';
                if(c.status === 'pending') {
                    actions = `<button class="btn btn-success" style="padding:4px 8px; margin-left:5px;" onclick="respondCustody(${c.id}, 'approved')">موافقة</button>
                               <button class="btn" style="background:var(--glpi-danger); color:white; padding:4px 8px;" onclick="respondCustody(${c.id}, 'rejected')">رفض</button>`;
                }
                let statusHtml = c.status === 'pending' ? '<span class="badge bg-orange">في انتظار الموافقة</span>' :
                                 c.status === 'approved' ? '<span class="badge bg-green">تمت الموافقة</span>' : 
                                 '<span class="badge bg-red">مرفوض</span>';
                tbodyC.innerHTML += `<tr><td>${c.asset_name}</td><td>${c.asset_code}</td><td>${statusHtml}</td><td>${actions}</td></tr>`;
            });
        }

        // --- إضافة أصل جديد للفرع ---
        window.openAssetModal = () => {
            document.getElementById('new-asset-name').value = '';
            document.getElementById('new-asset-code').value = '';
            document.getElementById('new-asset-cat').value = '';
            document.getElementById('asset-modal').style.display = 'flex';
        }

        window.saveNewAsset = async () => {
            const name = document.getElementById('new-asset-name').value.trim();
            const code = document.getElementById('new-asset-code').value.trim();
            const cat = document.getElementById('new-asset-cat').value.trim();
            if(!name || !code) return alert('اكتب الاسم والكود');

            await supabase.from('assets').insert([{ 
                name, code, category: cat, branch_id: userProfile.branch_id, status: 'working' 
            }]);
            document.getElementById('asset-modal').style.display = 'none';
            loadData();
            alert('تم إضافة الأصل بنجاح.');
        }

        // --- سجل الأصول ---
        window.loadAssetHistory = async () => {
            const assetId = document.getElementById('history-asset-select').value;
            if(!assetId) {
                document.getElementById('asset-history-display').style.display = 'none';
                return;
            }

            document.getElementById('asset-history-display').style.display = 'block';
            const tbody = document.getElementById('tbl-history-body');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">جاري التحميل...</td></tr>';

            // جلب التذاكر الخاصة بهذا الأصل
            const { data: tickets } = await supabase.from('tickets').select('*').eq('asset_id', assetId).order('created_at');

            let rows = '';
            // 1. تاريخ الإضافة
            const asset = globalAssets.find(a => a.id == assetId);
            if(asset) {
                rows += `<tr>
                    <td>${new Date(asset.created_at).toLocaleString('ar-EG')}</td>
                    <td style="color:var(--glpi-success); font-weight:bold;">تمت إضافة الأصل</td>
                    <td>تم إضافة ${asset.name} بكود ${asset.code}</td>
                </tr>`;
            }

            // 2. التذاكر
            tickets?.forEach(t => {
                rows += `<tr>
                    <td>${new Date(t.created_at).toLocaleString('ar-EG')}</td>
                    <td style="color:var(--glpi-danger); font-weight:bold;">تم فتح بلاغ عطل</td>
                    <td>${t.description} (${t.category || 'بدون تصنيف'})</td>
                </tr>`;
                if(t.status === 'closed') {
                    rows += `<tr>
                        <td>${t.closed_at ? new Date(t.closed_at).toLocaleString('ar-EG') : '-'}</td>
                        <td style="color:var(--glpi-success); font-weight:bold;">تم الإصلاح</td>
                        <td>${t.resolution_notes || 'تم الإصلاح'}</td>
                    </tr>`;
                }
            });

            if(rows === '') {
                rows = '<tr><td colspan="3" style="text-align:center;">لا يوجد سجل لهذا الأصل بعد.</td></tr>';
            }

            tbody.innerHTML = rows;
        }

        // --- باقي الدوال القديمة (إرسال بلاغ، موافقة، الخ) ---
        window.addTicket = async () => {
            const asset_id = document.getElementById('t-asset').value;
            const category = document.getElementById('t-cat').value;
            const priority = document.getElementById('t-priority').value;
            const desc = document.getElementById('t-desc').value;
            const file = document.getElementById('t-image').files[0];
            
            if(!asset_id || !desc) return alert('اختر الأصل واكتب الوصف');

            const btn = event.target;
            btn.innerText = 'جاري الإرسال...'; btn.disabled = true;

            let image_url = null;
            if(file) {
                const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
                const { error } = await supabase.storage.from('ticket-images').upload(fileName, file);
                if(!error) image_url = supabase.storage.from('ticket-images').getPublicUrl(fileName).data.publicUrl;
            }

            await supabase.from('tickets').insert([{ 
                asset_id, branch_id: userProfile.branch_id, title: 'بلاغ عطل', 
                description: desc, category, priority, image_url, created_by: userProfile.id 
            }]);
            
            await supabase.from('assets').update({ status: 'broken' }).eq('id', asset_id);
            
            document.getElementById('t-desc').value = '';
            document.getElementById('t-image').value = '';
            btn.innerText = 'إرسال البلاغ'; btn.disabled = false;
            loadData();
            alert('تم إرسال البلاغ بنجاح');
        };

        window.openApproveModal = (ticketId, assetId) => {
            currentApproveTicketId = ticketId;
            currentApproveAssetId = assetId;
            document.getElementById('branch-notes-input').value = '';
            document.getElementById('approve-modal').style.display = 'flex';
        }

        window.submitApproval = async () => {
            const notes = document.getElementById('branch-notes-input').value.trim();
            if(!notes) return alert('يجب كتابة ملاحظات الفرع أولاً (إجباري) لتأكيد الإصلاح.');

            await supabase.from('tickets').update({ 
                status: 'closed',
                branch_notes: notes 
            }).eq('id', currentApproveTicketId);
            
            await supabase.from('assets').update({ status: 'working' }).eq('id', currentApproveAssetId);
            
            document.getElementById('approve-modal').style.display = 'none';
            loadData();
            alert('تم تأكيد الإصلاح وإغلاق التذكرة بنجاح.');
        }

        window.rejectRepair = async (ticketId) => {
            const reason = prompt('اكتب سبب رفض الإصلاح (عشان المسؤول يعرف يعمل إيه):');
            if(reason === null) return;
            await supabase.from('tickets').update({ status: 'open', resolution_notes: 'تم الرفض من الفرع: ' + reason }).eq('id', ticketId);
            loadData();
            alert('تم رفض الإصلاح وإعادة فتح التذكرة للمسؤول.');
        }

        window.respondCustody = async (id, status) => {
            if(!confirm(`هل أنت متأكد من ${status === 'approved' ? 'الموافقة' : 'الرفض'}؟`)) return;
            const { data: c } = await supabase.from('custody_transfers').select('*').eq('id', id).single();
            await supabase.from('custody_transfers').update({ status, responded_by: userProfile.id, responded_at: new Date().toISOString() }).eq('id', id);
            if(status === 'approved') {
                const { data: newAsset } = await supabase.from('assets').insert([{ code: c.asset_code, name: c.asset_name, category: c.category, branch_id: userProfile.branch_id, status: 'working' }]).select().single();
                if(newAsset) await supabase.from('custody_transfers').update({ asset_id: newAsset.id }).eq('id', id);
            }
            loadData();
            alert('تم تسجيل الرد بنجاح');
        };
    </script>
</body>

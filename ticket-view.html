<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل التذكرة | Maintenance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #F4F6F9; padding: 40px; display: flex; justify-content: center; }
        .ticket-container { background: white; width: 800px; max-width: 100%; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 4px solid #2C3E50; position: relative; }
        .ticket-header { display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid #2C3E50; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .logo-box { margin-bottom: 10px; }
        .logo-box img { max-height: 80px; max-width: 200px; object-fit: contain; }
        .ticket-header h1 { color: #2C3E50; font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .ticket-header h2 { color: #7F8C8D; font-size: 16px; font-weight: 600; }
        .ticket-id-badge { background: #2C3E50; color: white; padding: 8px 20px; border-radius: 4px; font-weight: 700; font-size: 18px; margin-top: 15px; display: inline-block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .info-item { background: #F9F9F9; padding: 15px; border-radius: 6px; border-right: 4px solid #3498DB; }
        .info-label { font-size: 12px; color: #7F8C8D; font-weight: 700; margin-bottom: 5px; }
        .info-value { font-size: 16px; color: #2C3E50; font-weight: 700; }
        .section-box { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 25px; }
        .section-title { background: #F4F6F9; padding: 10px 15px; font-weight: 700; border-bottom: 1px solid #ddd; color: #2C3E50; }
        .section-body { padding: 15px; font-size: 15px; color: #555; line-height: 1.6; white-space: pre-wrap; }
        .image-box { text-align: center; margin-bottom: 30px; }
        .image-box img { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #ddd; }
        .badge { padding: 6px 12px; border-radius: 4px; font-size: 14px; font-weight: 700; color: white; display: inline-block; }
        .bg-green { background: #00A65A; } .bg-red { background: #DD4B39; } .bg-orange { background: #F39C12; } .bg-purple { background: #9b59b6; }
        .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 50px; text-align: center; padding-bottom: 20px;}
        .sig-box { border-top: 1px dashed #777; padding-top: 10px; color: #555; font-weight: 700; font-size: 16px; }
        .actions { display: flex; gap: 10px; border-top: 2px dashed #ccc; padding-top: 20px; margin-top: 30px; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; font-family: 'Cairo'; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: #2C3E50; color: white; }
        @media print {
            body { background: white; padding: 0; display: block; }
            .ticket-container { box-shadow: none; width: 100%; border: 2px solid #000; margin: 0; padding: 20px; }
            .actions { display: none !important; }
            .info-item, .section-box { break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="ticket-container" id="print-area">
        <div class="ticket-header">
            <div class="logo-box">
                <img src="https://cdn-icons-png.flaticon.com/512/3233/3233073.png" alt="Logo" style="filter: grayscale(100%);">
            </div>
            <h1>بن الغرباوي</h1>
            <h2>نظام إدارة الصيانة والتذاكر</h2>
            <div class="ticket-id-badge">
                تذكرة رقم: <span id="t-id">#...</span>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">الفرع</div>
                <div class="info-value" id="v-branch">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">الأصل (العهدة)</div>
                <div class="info-value" id="v-asset">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">تاريخ إنشاء البلاغ</div>
                <div class="info-value" id="v-date">-</div>
            </div>
            <div class="info-item" style="border-right-color: #F39C12;">
                <div class="info-label">حالة التذكرة</div>
                <div class="info-value" id="v-status">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">التصنيف</div>
                <div class="info-value" id="v-cat">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">الأولوية</div>
                <div class="info-value" id="v-priority">-</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">وصف المشكلة (البلاغ):</div>
            <div class="section-body" id="v-desc">-</div>
        </div>

        <div class="image-box" id="v-image-container" style="display: none;">
            <img id="v-image" src="" alt="صورة المشكلة">
        </div>

        <div class="section-box" id="resolution-box" style="display: none; border-color: #00A65A;">
            <div class="section-title" style="background: #E8F5E9; color: #00A65A;">تفاصيل الإصلاح (الحل):</div>
            <div class="section-body" id="v-resolution">-</div>
            <div style="padding: 10px 15px; font-size: 12px; color: #777; border-top: 1px solid #ddd;">
                تم الإغلاق بواسطة: <span id="v-closed-by">-</span> | بتاريخ: <span id="v-closed-at">-</span>
            </div>
        </div>

        <div class="signatures">
            <div class="sig-box">توقيع مدير الفرع</div>
            <div class="sig-box">توقيع مسئول الصيانة</div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> طباعة التذكرة</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')

        const ticketId = new URLSearchParams(window.location.search).get('id');
        
        if(!ticketId) { 
            document.body.innerHTML = '<h1 style="text-align:center; margin-top:100px; font-family:Cairo;">لم يتم تحديد تذكرة للعرض، يرجى الدخول من جدول التذاكر.</h1>';
        } else {
            loadTicket();
        }

        async function loadTicket() {
            const { data: t, error } = await supabase.from('tickets')
                .select('*, assets(name, code), branches(name)')
                .eq('id', ticketId)
                .single();

            if(error || !t) { 
                document.getElementById('v-desc').innerText = 'التذكرة غير موجودة أو تم حذفها.';
                return; 
            }

            document.getElementById('t-id').innerText = `#${t.id}`;
            document.getElementById('v-branch').innerText = t.branches?.name || '-';
            document.getElementById('v-asset').innerText = `${t.assets?.name || ''} (${t.assets?.code || ''})`;
            document.getElementById('v-date').innerText = new Date(t.created_at).toLocaleString('ar-EG');
            document.getElementById('v-cat').innerText = t.category || 'غير محدد';
            
            let pText = t.priority === 'urgent' ? 'طارئة جداً' : t.priority === 'high' ? 'مهمة' : 'عادية';
            document.getElementById('v-priority').innerText = pText;

            let statusHtml = t.status === 'open' ? '<span class="badge bg-orange">مفتوح</span>' : 
                             t.status === 'pending_approval' ? '<span class="badge bg-purple">بانتظار تأكيد الفرع</span>' :
                             t.status === 'closed' ? '<span class="badge bg-green">مغلق</span>' : 
                             '<span class="badge" style="background:#3498DB;">قيد المعالجة</span>';
            document.getElementById('v-status').innerHTML = statusHtml;
            document.getElementById('v-desc').innerText = t.description || 'لا يوجد وصف';

            if(t.image_url) {
                document.getElementById('v-image-container').style.display = 'block';
                document.getElementById('v-image').src = t.image_url;
            }

            if((t.status === 'closed' || t.status === 'pending_approval') && t.resolution_notes) {
                let closedByName = 'مسئول الصيانة';
                if(t.closed_by) {
                    const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', t.closed_by).single();
                    if(profile) closedByName = profile.full_name;
                }

                document.getElementById('resolution-box').style.display = 'block';
                document.getElementById('v-resolution').innerText = t.resolution_notes;
                document.getElementById('v-closed-by').innerText = closedByName;
                document.getElementById('v-closed-at').innerText = t.closed_at ? new Date(t.closed_at).toLocaleString('ar-EG') : '-';
            }
        }
    </script>
</body>
</html>

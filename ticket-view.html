<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل التذكرة | Maintenance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #F4F6F9; padding: 40px; display: flex; justify-content: center; }
        
        .ticket-container { background: white; width: 800px; max-width: 100%; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .ticket-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #ccc; padding-bottom: 20px; margin-bottom: 30px; }
        .ticket-header h1 { color: #2C3E50; font-size: 24px; }
        .ticket-header h2 { color: #7F8C8D; font-size: 16px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .info-item { background: #F9F9F9; padding: 15px; border-radius: 6px; border-right: 4px solid #3498DB; }
        .info-label { font-size: 12px; color: #7F8C8D; font-weight: 700; margin-bottom: 5px; }
        .info-value { font-size: 16px; color: #2C3E50; font-weight: 700; }
        
        .description-box { background: #F9F9F9; padding: 20px; border-radius: 6px; margin-bottom: 30px; }
        .description-box h3 { font-size: 16px; color: #2C3E50; margin-bottom: 10px; }
        .description-box p { font-size: 15px; color: #555; line-height: 1.6; white-space: pre-wrap; }
        
        .image-box { text-align: center; margin-bottom: 30px; }
        .image-box img { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #ddd; }
        
        .badge { padding: 6px 12px; border-radius: 4px; font-size: 14px; font-weight: 700; color: white; display: inline-block; }
        .bg-green { background: #00A65A; } .bg-red { background: #DD4B39; } .bg-orange { background: #F39C12; }

        .actions { display: flex; gap: 10px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; font-family: 'Cairo'; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: #2C3E50; color: white; }
        .btn-secondary { background: #95A5A6; color: white; }
        
        /* ستايل الطباعة */
        @media print {
            body { background: white; padding: 0; }
            .ticket-container { box-shadow: none; padding: 0; width: 100%; }
            .actions { display: none !important; }
            .info-item, .description-box { break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="ticket-container" id="print-area">
        <div class="ticket-header">
            <div>
                <h1><i class="fas fa-tools"></i> Maintenance System</h1>
                <h2>تفاصيل تذكرة الصيانة</h2>
            </div>
            <div id="ticket-id-display" style="font-size: 18px; font-weight: 700; color: #3498DB;"></div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">الفرع</div>
                <div class="info-value" id="v-branch">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">الأصل (العهدة)</div>
                <div class="info-value" id="v-asset">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">تاريخ البلاغ</div>
                <div class="info-value" id="v-date">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">الحالة</div>
                <div class="info-value" id="v-status">-</div>
            </div>
        </div>

        <div class="description-box">
            <h3>وصف المشكلة:</h3>
            <p id="v-desc">-</p>
        </div>

        <div class="image-box" id="v-image-container" style="display: none;">
            <img id="v-image" src="" alt="صورة المشكلة">
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> طباعة التذكرة</button>
            <button class="btn btn-secondary" onclick="window.close()"><i class="fas fa-times"></i> إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabase = createClient('https://clnivqqrldxzsfeumkof.supabase.co', 'sb_publishable_qAKbMTh8UdXjJ13nCP1JgQ_Q4xLxMCv')

        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('id');

        if(!ticketId) {
            alert('تذكرة غير موجودة');
            window.close();
        }

        async function loadTicket() {
            const { data: t, error } = await supabase.from('tickets')
                .select('*, assets(name, code), branches(name), profiles(full_name)')
                .eq('id', ticketId)
                .single();

            if(error || !t) {
                alert('حدث خطأ في جلب التذكرة');
                return;
            }

            document.getElementById('ticket-id-display').innerText = `تذكرة #${t.id}`;
            document.getElementById('v-branch').innerText = t.branches?.name || '-';
            document.getElementById('v-asset').innerText = `${t.assets?.name} (${t.assets?.code})`;
            
            const date = new Date(t.created_at).toLocaleString('ar-EG');
            document.getElementById('v-date').innerText = date;
            
            let statusHtml = t.status === 'open' ? '<span class="badge bg-orange">مفتوح</span>' : 
                             t.status === 'closed' ? '<span class="badge bg-green">مغلق</span>' : 
                             '<span class="badge" style="background:#3498DB;">قيد المعالجة</span>';
            document.getElementById('v-status').innerHTML = statusHtml;
            
            document.getElementById('v-desc').innerText = t.description || 'لا يوجد وصف';

            if(t.image_url) {
                document.getElementById('v-image-container').style.display = 'block';
                document.getElementById('v-image').src = t.image_url;
            }
        }

        loadTicket();
    </script>
</body>
</html>
